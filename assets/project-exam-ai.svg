<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6FF00"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#portalBg)"/>

  <!-- Geometric Grid Accent -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.35">
    <line x1="0" y1="110" x2="600" y2="110"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="330" x2="600" y2="330"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
  </g>

  <!-- Main Portal Window -->
  <g transform="translate(60, 40)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="480" height="370" rx="10" fill="#0B132B" stroke="#000000" stroke-width="3"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="480" height="42" rx="10" fill="#1C2541" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="30" width="480" height="12" fill="#1C2541"/>
    <circle cx="22" cy="21" r="5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="21" r="5" fill="#10B981"/>
    <text x="240" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="middle">EXAMAI PORTAL • DYNAMIC STUDY ASSISTANT</text>

    <!-- Top Stats Row (3 Mini Bento Cards) -->
    <g transform="translate(25, 60)">
      <!-- Card 1: Daily Target -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text x="12" y="20" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">DAILY PLAN</text>
        <text x="12" y="44" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#D6FF00">DAY 14/30</text>
        <text x="12" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#10B981">● 92% COMPLETED</text>
      </g>
      <!-- Card 2: AI Accuracy Score -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="135" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text x="12" y="20" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">AI ACCURACY</text>
        <text x="12" y="44" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#00F0FF">96.4%</text>
        <text x="12" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#60A5FA">● HIGH CONFIDENCE</text>
      </g>
      <!-- Card 3: Questions Solved -->
      <g transform="translate(296, 0)">
        <rect x="0" y="0" width="134" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text x="12" y="20" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">SOLVED MODULES</text>
        <text x="12" y="44" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">1,240+</text>
        <text x="12" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#FBBF24">● VERIFIED RANK</text>
      </g>
    </g>

    <!-- Interactive Learning Roadmap Chart -->
    <g transform="translate(25, 145)">
      <rect x="0" y="0" width="430" height="135" rx="8" fill="#151E32" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">AI ADAPTIVE LEARNING PROGRESSION</text>
      
      <!-- Progress Bar 1 -->
      <g transform="translate(18, 42)">
        <text x="0" y="12" font-family="'Space Mono', monospace" font-size="10" fill="#94A3B8">Mock Test Analysis (Reasoning)</text>
        <rect x="0" y="18" width="394" height="10" rx="5" fill="#1E293B"/>
        <rect x="0" y="18" width="350" height="10" rx="5" fill="url(#limeGrad)"/>
        <text x="365" y="12" font-family="'Space Mono', monospace" font-size="10" font-weight="800" fill="#D6FF00">92%</text>
      </g>
      <!-- Progress Bar 2 -->
      <g transform="translate(18, 76)">
        <text x="0" y="12" font-family="'Space Mono', monospace" font-size="10" fill="#94A3B8">Quantitative Aptitude Speed</text>
        <rect x="0" y="18" width="394" height="10" rx="5" fill="#1E293B"/>
        <rect x="0" y="18" width="310" height="10" rx="5" fill="url(#cyanGrad)"/>
        <text x="365" y="12" font-family="'Space Mono', monospace" font-size="10" font-weight="800" fill="#00F0FF">84%</text>
      </g>
    </g>

    <!-- Bottom Action Pill Strip -->
    <g transform="translate(25, 295)">
      <rect x="0" y="0" width="430" height="52" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="14" fill="#D6FF00"/>
      <path d="M22 26 L27 31 L35 21" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">GENERATE NEW AI MOCK TEST</text>
      <text x="52" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Customized according to weakness patterns</text>
      
      <rect x="330" y="11" width="85" height="30" rx="4" fill="#00F0FF" stroke="#000" stroke-width="1.5"/>
      <text x="372" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">START TEST</text>
    </g>
  </g>

  <!-- Top Right Netlify Live Stamp -->
  <g transform="translate(435, 25)" rotate="6">
    <rect x="0" y="0" width="125" height="28" rx="4" fill="#00F0FF" stroke="#000" stroke-width="2"/>
    <text x="62" y="19" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#000" text-anchor="middle">● NETLIFY LIVE</text>
  </g>
</svg>

