<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="aiBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FF00"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="geminiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#chatBg)"/>

  <!-- Subtle Matrix Grid -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.35">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
  </g>

  <!-- Central Chat UI Window Mockup -->
  <g transform="translate(60, 40)" filter="url(#cardShadow)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="480" height="370" rx="10" fill="#0B132B" stroke="#000000" stroke-width="3"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="480" height="42" rx="10" fill="#1C2541" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="30" width="480" height="12" fill="#1C2541"/>
    
    <!-- Dots -->
    <circle cx="22" cy="21" r="5" fill="#EF4444" stroke="#000" stroke-width="1"/>
    <circle cx="38" cy="21" r="5" fill="#F59E0B" stroke="#000" stroke-width="1"/>
    <circle cx="54" cy="21" r="5" fill="#10B981" stroke="#000" stroke-width="1"/>
    
    <text x="240" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="middle">GEMINI CHATBOT AI • LIVE ON RENDER</text>

    <!-- Chat Message 1 (User Bubble) -->
    <g transform="translate(180, 65)">
      <rect x="0" y="0" width="270" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="15" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Can you analyze this system design?</text>
      <text x="15" y="38" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">02:30 IST • USER</text>
    </g>

    <!-- Chat Message 2 (AI Response Bubble with Neon Lime Highlight) -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="360" height="95" rx="8" fill="url(#aiBubble)" stroke="#000000" stroke-width="2"/>
      <!-- AI Icon Pin -->
      <circle cx="25" cy="26" r="12" fill="#000000"/>
      <text x="25" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="900" fill="#D6FF00" text-anchor="middle">AI</text>
      
      <text x="48" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="900" fill="#000000">GEMINI LLM ASSISTANT</text>
      <text x="48" y="42" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0F172A">"Architecture analyzed: Microservices with</text>
      <text x="48" y="58" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0F172A">Node.js, PostgreSQL &amp; caching layer are robust."</text>
      
      <rect x="48" y="68" width="85" height="18" rx="4" fill="#000000"/>
      <text x="90" y="81" font-family="'Space Mono', monospace" font-size="9" font-weight="800" fill="#D6FF00" text-anchor="middle">LATENCY: 42ms</text>
    </g>

    <!-- Interactive AI Neural Sparkles Visual -->
    <g transform="translate(380, 240)">
      <circle cx="45" cy="45" r="35" fill="none" stroke="url(#geminiGlow)" stroke-width="2.5" stroke-dasharray="6 6"/>
      <circle cx="45" cy="45" r="22" fill="#000000" stroke="#00F0FF" stroke-width="2"/>
      <path d="M45 30 L48 40 L58 45 L48 50 L45 60 L42 50 L32 45 L42 40 Z" fill="#D6FF00"/>
    </g>

    <!-- Chat Message 3 (Typing / Status Bar) -->
    <g transform="translate(25, 245)">
      <rect x="0" y="0" width="320" height="42" rx="6" fill="#1C2541" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="21" r="4" fill="#D6FF00"/>
      <circle cx="32" cy="21" r="4" fill="#00F0FF"/>
      <circle cx="44" cy="21" r="4" fill="#A855F7"/>
      <text x="60" y="25" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#CBD5E1">Streaming context token 512...</text>
    </g>

    <!-- Bottom Input Bar Mockup -->
    <g transform="translate(25, 305)">
      <rect x="0" y="0" width="430" height="46" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="28" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#64748B">Ask Nilay's AI assistant anything...</text>
      <rect x="360" y="8" width="60" height="30" rx="4" fill="#D6FF00" stroke="#000000" stroke-width="1.5"/>
      <text x="390" y="27" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="900" fill="#000000" text-anchor="middle">SEND ➔</text>
    </g>
  </g>

  <!-- Brutalist Stamp Badge -->
  <g transform="translate(430, 25)" rotate="6">
    <rect x="0" y="0" width="120" height="28" rx="4" fill="#D6FF00" stroke="#000" stroke-width="2"/>
    <text x="60" y="19" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#000" text-anchor="middle">● LIVE ON RENDER</text>
  </g>
</svg>

