<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" width="100%" height="100%">
  <defs>
    <!-- Realistic Chrome Gradient -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#d8dde3"/>
      <stop offset="40%" stop-color="#8a94a0"/>
      <stop offset="48%" stop-color="#2d3138"/>
      <stop offset="52%" stop-color="#f5f7fa"/>
      <stop offset="70%" stop-color="#b0b8c2"/>
      <stop offset="90%" stop-color="#69717d"/>
      <stop offset="100%" stop-color="#3d424a"/>
    </linearGradient>

    <!-- Side Link Gradient -->
    <linearGradient id="chromeMetalSide" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2b2e34"/>
      <stop offset="25%" stop-color="#eaf0f6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#7a828d"/>
      <stop offset="100%" stop-color="#1f2226"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="metallicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="14" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#metallicShadow)">
    <!-- Link 1 (Front View) -->
    <g transform="translate(140, 20)">
      <path d="M 60,0 C 93,0 120,27 120,60 L 120,130 C 120,163 93,190 60,190 C 27,190 0,163 0,130 L 0,60 C 0,27 27,0 60,0 Z 
               M 60,32 C 45,32 32,45 32,60 L 32,130 C 32,145 45,158 60,158 C 75,158 88,145 88,130 L 88,60 C 88,45 75,32 60,32 Z" 
            fill="url(#chromeMetal)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Interlocking Side Link 1-2 -->
    <g transform="translate(178, 145)">
      <rect x="0" y="0" width="44" height="120" rx="22" fill="url(#chromeMetalSide)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Link 2 (Front View) -->
    <g transform="translate(140, 220)">
      <path d="M 60,0 C 93,0 120,27 120,60 L 120,130 C 120,163 93,190 60,190 C 27,190 0,163 0,130 L 0,60 C 0,27 27,0 60,0 Z 
               M 60,32 C 45,32 32,45 32,60 L 32,130 C 32,145 45,158 60,158 C 75,158 88,145 88,130 L 88,60 C 88,45 75,32 60,32 Z" 
            fill="url(#chromeMetal)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Interlocking Side Link 2-3 -->
    <g transform="translate(178, 345)">
      <rect x="0" y="0" width="44" height="120" rx="22" fill="url(#chromeMetalSide)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Link 3 (Front View) -->
    <g transform="translate(140, 420)">
      <path d="M 60,0 C 93,0 120,27 120,60 L 120,130 C 120,163 93,190 60,190 C 27,190 0,163 0,130 L 0,60 C 0,27 27,0 60,0 Z 
               M 60,32 C 45,32 32,45 32,60 L 32,130 C 32,145 45,158 60,158 C 75,158 88,145 88,130 L 88,60 C 88,45 75,32 60,32 Z" 
            fill="url(#chromeMetal)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Interlocking Side Link 3-4 -->
    <g transform="translate(178, 545)">
      <rect x="0" y="0" width="44" height="120" rx="22" fill="url(#chromeMetalSide)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Link 4 (Front View) -->
    <g transform="translate(140, 620)">
      <path d="M 60,0 C 93,0 120,27 120,60 L 120,130 C 120,163 93,190 60,190 C 27,190 0,163 0,130 L 0,60 C 0,27 27,0 60,0 Z 
               M 60,32 C 45,32 32,45 32,60 L 32,130 C 32,145 45,158 60,158 C 75,158 88,145 88,130 L 88,60 C 88,45 75,32 60,32 Z" 
            fill="url(#chromeMetal)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Interlocking Side Link 4-5 -->
    <g transform="translate(178, 745)">
      <rect x="0" y="0" width="44" height="120" rx="22" fill="url(#chromeMetalSide)" stroke="#111" stroke-width="2"/>
    </g>
  </g>
</svg>

