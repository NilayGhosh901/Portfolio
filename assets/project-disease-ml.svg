<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1A102F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="healthPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6FF00"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="boxDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#mlBg)"/>

  <!-- Matrix Grid -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="110" x2="600" y2="110"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="330" x2="600" y2="330"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
  </g>

  <!-- Main Window Frame -->
  <g transform="translate(60, 40)" filter="url(#boxDropShadow)">
    <rect x="0" y="0" width="480" height="370" rx="10" fill="#0B1120" stroke="#000000" stroke-width="3"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="480" height="42" rx="10" fill="#1E1B4B" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="30" width="480" height="12" fill="#1E1B4B"/>
    <circle cx="22" cy="21" r="5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="21" r="5" fill="#10B981"/>
    <text x="240" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#C4B5FD" text-anchor="middle">PYTHON &amp; SCIKIT-LEARN • DISEASE PREDICTION</text>

    <!-- Top Diagnostic Pulse Card -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="430" height="85" rx="8" fill="#17122A" stroke="#3730A3" stroke-width="1.5"/>
      <text x="18" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#A855F7">REAL-TIME BIOMETRIC PULSE &amp; SYMPTOMS</text>
      
      <!-- ECG Heartbeat Line -->
      <path d="M18 55 L90 55 L105 40 L115 72 L125 25 L135 75 L145 55 L220 55 L235 38 L245 68 L255 55 L410 55" fill="none" stroke="url(#healthPulse)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Prediction Badge -->
      <g transform="translate(320, 15)">
        <rect x="0" y="0" width="95" height="28" rx="4" fill="#D6FF00" stroke="#000" stroke-width="1.5"/>
        <text x="47" y="18" font-family="'Space Mono', monospace" font-size="9" font-weight="900" fill="#000" text-anchor="middle">98.2% CONF</text>
      </g>
    </g>

    <!-- ML Classification Decision Tree Visual -->
    <g transform="translate(25, 160)">
      <rect x="0" y="0" width="230" height="185" rx="8" fill="#15132B" stroke="#334155" stroke-width="1.5"/>
      <text x="16" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#E2E8F0">RANDOM FOREST TREE</text>
      
      <!-- Tree Nodes -->
      <circle cx="115" cy="55" r="14" fill="#A855F7" stroke="#000" stroke-width="1.5"/>
      <text x="115" y="59" font-family="'Space Mono', monospace" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle">ROOT</text>

      <line x1="115" y1="69" x2="65" y2="105" stroke="#6366F1" stroke-width="1.5"/>
      <line x1="115" y1="69" x2="165" y2="105" stroke="#6366F1" stroke-width="1.5"/>

      <circle cx="65" cy="115" r="12" fill="#10B981" stroke="#000" stroke-width="1.5"/>
      <text x="65" y="119" font-family="'Space Mono', monospace" font-size="8" font-weight="800" fill="#FFF" text-anchor="middle">NODE 1</text>

      <circle cx="165" cy="115" r="12" fill="#3B82F6" stroke="#000" stroke-width="1.5"/>
      <text x="165" y="119" font-family="'Space Mono', monospace" font-size="8" font-weight="800" fill="#FFF" text-anchor="middle">NODE 2</text>

      <line x1="65" y1="127" x2="40" y2="155" stroke="#64748B" stroke-width="1.5"/>
      <line x1="65" y1="127" x2="90" y2="155" stroke="#64748B" stroke-width="1.5"/>
      <line x1="165" y1="127" x2="140" y2="155" stroke="#64748B" stroke-width="1.5"/>
      <line x1="165" y1="127" x2="190" y2="155" stroke="#64748B" stroke-width="1.5"/>

      <circle cx="40" cy="162" r="7" fill="#D6FF00"/>
      <circle cx="90" cy="162" r="7" fill="#EC4899"/>
      <circle cx="140" cy="162" r="7" fill="#10B981"/>
      <circle cx="190" cy="162" r="7" fill="#00F0FF"/>
    </g>

    <!-- Algorithms & Feature Importance Panel -->
    <g transform="translate(270, 160)">
      <rect x="0" y="0" width="185" height="185" rx="8" fill="#15132B" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#E2E8F0">MODELS BENCHMARK</text>

      <!-- Model 1 -->
      <g transform="translate(14, 38)">
        <text x="0" y="12" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">Random Forest</text>
        <rect x="0" y="16" width="155" height="8" rx="4" fill="#1E293B"/>
        <rect x="0" y="16" width="148" height="8" rx="4" fill="#D6FF00"/>
        <text x="125" y="12" font-family="'Space Mono', monospace" font-size="9" font-weight="800" fill="#D6FF00">98%</text>
      </g>

      <!-- Model 2 -->
      <g transform="translate(14, 76)">
        <text x="0" y="12" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">Decision Tree</text>
        <rect x="0" y="16" width="155" height="8" rx="4" fill="#1E293B"/>
        <rect x="0" y="16" width="135" height="8" rx="4" fill="#A855F7"/>
        <text x="125" y="12" font-family="'Space Mono', monospace" font-size="9" font-weight="800" fill="#A855F7">91%</text>
      </g>

      <!-- Model 3 -->
      <g transform="translate(14, 114)">
        <text x="0" y="12" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">Naïve Bayes</text>
        <rect x="0" y="16" width="155" height="8" rx="4" fill="#1E293B"/>
        <rect x="0" y="16" width="128" height="8" rx="4" fill="#00F0FF"/>
        <text x="125" y="12" font-family="'Space Mono', monospace" font-size="9" font-weight="800" fill="#00F0FF">87%</text>
      </g>

      <rect x="14" y="146" width="155" height="26" rx="4" fill="#000" stroke="#D6FF00" stroke-width="1"/>
      <text x="91" y="162" font-family="'Space Mono', monospace" font-size="9" font-weight="800" fill="#D6FF00" text-anchor="middle">PYTHON 3.11 • SCIKIT</text>
    </g>
  </g>

  <!-- Top Right Python Stamp -->
  <g transform="translate(435, 25)" rotate="6">
    <rect x="0" y="0" width="125" height="28" rx="4" fill="#A855F7" stroke="#000" stroke-width="2"/>
    <text x="62" y="19" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">● PYTHON ML</text>
  </g>
</svg>

