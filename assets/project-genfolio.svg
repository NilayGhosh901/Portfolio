<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="genBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6FF00"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="boxDrop2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#genBg)"/>

  <!-- Subtle Blueprint Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="110" x2="600" y2="110"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="330" x2="600" y2="330"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
  </g>

  <!-- Main Window Frame -->
  <g transform="translate(60, 40)" filter="url(#boxDrop2)">
    <rect x="0" y="0" width="480" height="370" rx="10" fill="#0B132B" stroke="#000000" stroke-width="3"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="480" height="42" rx="10" fill="#064E3B" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="30" width="480" height="12" fill="#064E3B"/>
    <circle cx="22" cy="21" r="5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="21" r="5" fill="#10B981"/>
    <text x="240" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#A7F3D0" text-anchor="middle">GENFOLIO • AI PORTFOLIO WEBSITE BUILDER</text>

    <!-- Top Generation Status Banner -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="430" height="75" rx="8" fill="#062C24" stroke="#059669" stroke-width="1.5"/>
      <circle cx="36" cy="37" r="18" fill="#D6FF00"/>
      <text x="36" y="43" font-family="'Space Mono', monospace" font-size="14" font-weight="900" fill="#000" text-anchor="middle">⚡</text>
      
      <text x="68" y="32" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">PORTFOLIO BUNDLE GENERATED</text>
      <text x="68" y="50" font-family="'Space Mono', monospace" font-size="10" fill="#6EE7B7">Ready for download: portfolio_site.zip (1.4 MB)</text>
      
      <!-- Download Button Badge -->
      <g transform="translate(325, 20)">
        <rect x="0" y="0" width="90" height="34" rx="4" fill="#D6FF00" stroke="#000" stroke-width="1.5"/>
        <text x="45" y="21" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">ZIP EXPORT ⤓</text>
      </g>
    </g>

    <!-- Visual Portfolio Wireframe Canvas Preview -->
    <g transform="translate(25, 150)">
      <rect x="0" y="0" width="260" height="190" rx="8" fill="#151E32" stroke="#334155" stroke-width="1.5"/>
      <text x="16" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#E2E8F0">DYNAMIC TEMPLATE PREVIEW</text>

      <!-- Mini Site Wireframe Elements -->
      <!-- Hero Header -->
      <rect x="16" y="38" width="228" height="24" rx="4" fill="#1E293B"/>
      <circle cx="28" cy="50" r="5" fill="#D6FF00"/>
      <rect x="42" y="47" width="50" height="6" rx="3" fill="#64748B"/>
      <rect x="180" y="45" width="50" height="10" rx="3" fill="#059669"/>

      <!-- Split Hero Box -->
      <rect x="16" y="70" width="110" height="60" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <rect x="26" y="80" width="70" height="8" rx="2" fill="#FFFFFF"/>
      <rect x="26" y="94" width="90" height="4" rx="2" fill="#64748B"/>
      <rect x="26" y="104" width="60" height="4" rx="2" fill="#64748B"/>
      <rect x="26" y="115" width="40" height="8" rx="2" fill="#D6FF00"/>

      <rect x="134" y="70" width="110" height="60" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <circle cx="189" cy="95" r="14" fill="#D6FF00"/>
      <text x="189" y="99" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">IMG</text>

      <!-- Projects Grid Wireframe -->
      <rect x="16" y="138" width="72" height="42" rx="4" fill="#1E293B"/>
      <rect x="94" y="138" width="72" height="42" rx="4" fill="#1E293B"/>
      <rect x="172" y="138" width="72" height="42" rx="4" fill="#1E293B"/>
    </g>

    <!-- Generated Code Stack Files List -->
    <g transform="translate(300, 150)">
      <rect x="0" y="0" width="155" height="190" rx="8" fill="#151E32" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#E2E8F0">ASSETS BUILT</text>

      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="128" height="26" rx="4" fill="#1E293B"/>
        <text x="10" y="17" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#D6FF00">📄 index.html</text>
      </g>
      <g transform="translate(14, 72)">
        <rect x="0" y="0" width="128" height="26" rx="4" fill="#1E293B"/>
        <text x="10" y="17" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8">🎨 styles.css</text>
      </g>
      <g transform="translate(14, 106)">
        <rect x="0" y="0" width="128" height="26" rx="4" fill="#1E293B"/>
        <text x="10" y="17" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FBBF24">⚡ script.js</text>
      </g>
      <g transform="translate(14, 140)">
        <rect x="0" y="0" width="128" height="26" rx="4" fill="#1E293B"/>
        <text x="10" y="17" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#A7F3D0">📦 assets.zip</text>
      </g>
    </g>
  </g>

  <!-- Top Right Generator Stamp -->
  <g transform="translate(435, 25)" rotate="6">
    <rect x="0" y="0" width="125" height="28" rx="4" fill="#10B981" stroke="#000" stroke-width="2"/>
    <text x="62" y="19" font-family="'Space Mono', monospace" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">● FULL STACK AI</text>
  </g>
</svg>

